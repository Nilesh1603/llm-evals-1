name: Nightly LLM Evaluation Pipeline

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 2 AM UTC to catch model performance drift
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest LLM Evaluation Harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/test_evals.py -v --md-report --html=eval_report.html

      - name: Upload Evaluation Dashboard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-report
          path: eval_report.html
